# Test Configuration
spring.application.name=reservation-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Feign clients (we use mocks)
spring.cloud.openfeign.circuitbreaker.enabled=false

# External Service URLs (required but not used - we use mocks)
services.user-service.url=http://localhost:8081
services.stall-service.url=http://localhost:8082

# Logging
logging.level.exhibitflow.reservation_service=INFO
logging.level.org.springframework.web=WARN
