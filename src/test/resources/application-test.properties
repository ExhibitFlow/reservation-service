# Test Configuration
spring.application.name=reservation-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Feign clients auto-configuration (we use mocks)
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# External Service URLs (not used in tests, but needed for config)
services.user-service.url=http://localhost:8081
services.stall-service.url=http://localhost:8082

# Logging
logging.level.exhibitflow.reservation_service=DEBUG
logging.level.org.springframework.web=INFO
