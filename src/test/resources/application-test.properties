# Test Configuration
spring.application.name=reservation-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Feign clients (we use mocks)
spring.cloud.openfeign.circuitbreaker.enabled=false

# External Service URLs (required but not used - we use mocks)
services.user-service.url=http://localhost:8081
services.stall-service.url=http://localhost:8082

# Logging
logging.level.exhibitflow.reservation_service=INFO
logging.level.org.springframework.web=WARN

# Kafka Configuration for Testing
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=reservation-service-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
kafka.topics.reservation-created=reservation.created
kafka.topics.reservation-updated=reservation.updated
kafka.topics.reservation-cancelled=reservation.cancelled
kafka.topics.payment-completed=reservation.payment.completed
kafka.topics.payment-expired=reservation.payment.expired
