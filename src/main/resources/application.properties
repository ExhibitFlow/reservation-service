spring.application.name=reservation-service
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation_db
spring.datasource.username=postgres
spring.datasource.password=asd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Microservices Configuration - External Service URLs
services.user-service.url=http://localhost:8081
services.stall-service.url=http://localhost:8082

# Application Configuration
reservation.reservation.max-reservations-per-user=3
reservation.reservation.payment-lock-minutes=5

# QR Code Configuration
reservation.qr-code.width=300
reservation.qr-code.height=300
reservation.qr-code.error-correction-level=H

# Cleanup Scheduler Configuration
reservation.cleanup.fixed-rate-ms=60000

# Logging
logging.level.exhibitflow.reservation_service=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %X{requestId} %X{userId} - %msg%n

