spring.application.name=reservation-service
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/reservation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Microservices Configuration - External Service URLs
services.user-service.url=http://localhost:8081
services.stall-service.url=http://localhost:8082
services.qrcode-service.url=http://localhost:8083

# Logging
logging.level.exhibitflow.reservation_service=DEBUG
